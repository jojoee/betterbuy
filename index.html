<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#102a43" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Betterbuy" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.ico" sizes="48x48" />
    <link
      rel="icon"
      href="./icons/betterbuy-overlap.svg"
      sizes="any"
      type="image/svg+xml"
    />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180x180.png" />
    <title>Betterbuy — Find the better deal</title>
  </head>
  <body>
    <div id="app">
      <main class="container app-shell">
        <header class="ds-page-header">
          <div class="ds-page-header__identity">
            <img id="brand-icon" alt="" />
            <h1>Betterbuy <span>· Find the better deal</span></h1>
          </div>
        </header>
        <section class="ds-card calculator" aria-labelledby="compare-title">
          <div class="ds-section-header">
            <h2 id="compare-title">Compare by cost per size</h2>
          </div>
          <div class="row g-3 options">
            <div class="col-12 col-sm-6">
              <fieldset class="ds-fieldset">
                <legend>Option A</legend>
                <label class="ds-field">
                  <span>Cost</span>
                  <input
                    class="ds-input"
                    data-key="costA"
                    aria-label="A Cost"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    step="any"
                    placeholder="0"
                  />
                </label>
                <label class="ds-field">
                  <span>Size</span>
                  <input
                    class="ds-input"
                    data-key="sizeA"
                    aria-label="A Size"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    step="any"
                    placeholder="0"
                  />
                </label>
              </fieldset>
            </div>
            <div class="col-12 col-sm-6">
              <fieldset class="ds-fieldset">
                <legend>Option B</legend>
                <label class="ds-field">
                  <span>Cost</span>
                  <input
                    class="ds-input"
                    data-key="costB"
                    aria-label="B Cost"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    step="any"
                    placeholder="0"
                  />
                </label>
                <label class="ds-field">
                  <span>Size</span>
                  <input
                    class="ds-input"
                    data-key="sizeB"
                    aria-label="B Size"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    step="any"
                    placeholder="0"
                  />
                </label>
              </fieldset>
            </div>
          </div>
          <div id="comparison-result"></div>
          <button
            id="save"
            class="ds-button ds-button--primary ds-button--block save"
            disabled
          >
            Save into history
          </button>
        </section>
        <section class="ds-card history" aria-labelledby="history-title">
          <div class="ds-section-header history-title">
            <h2 id="history-title">History</h2>
            <span id="history-count" class="ds-badge ds-badge--neutral"
              >0/50</span
            >
          </div>
          <div id="history-content"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
